<!doctype html>
<html lang="pl" style="background-color: #0a0a0a; color: #efefef;">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0a0a" />
    <meta name="description" content="Kolekcja prostych, pięknych gier przeglądarkowych. Bez logowania, bez reklam." />
    <link rel="icon" type="image/svg+xml" href="./icons/favicon.svg" />
    <link rel="apple-touch-icon" href="./icons/icon-192.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <title>AllGames</title>
    <script>
      (function() {
        try {
          var t = localStorage.getItem('allgames:theme') || 'dark';
          document.documentElement.setAttribute('data-theme', t);
          document.documentElement.setAttribute('data-all-theme', t);
          var isLight = t === 'light' || t === 'e-ink-light';
          var bg = isLight ? '#f2f1ec' : '#0a0a0a';
          var fg = isLight ? '#111111' : '#efefef';
          document.documentElement.style.backgroundColor = bg;
          document.documentElement.style.color = fg;
          if (t.indexOf('e-ink') !== -1) {
            document.documentElement.setAttribute('data-eink', 'true');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body style="background-color: inherit; color: inherit;">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
